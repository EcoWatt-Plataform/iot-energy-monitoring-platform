# Rate-limit zone must be defined in the http {} context of /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# HTTP: keep only ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ecowatt.ar www.ecowatt.ar;

    location ^~ /.well-known/acme-challenge/ {
        # ACME HTTP-01 challenge webroot. Ensure this directory exists before issuing certificates:
        #   sudo mkdir -p /var/www/html
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (TLS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecowatt.ar www.ecowatt.ar;

    ssl_certificate /etc/letsencrypt/live/ecowatt.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecowatt.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Limit request sizes
    client_max_body_size 1m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        # Rate limiting: 30 requests/s per IP, burst up to 60
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
